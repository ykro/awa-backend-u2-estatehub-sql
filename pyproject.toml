[project]
name = "estatehub-sql-api"
version = "2.0.0"
description = "EstateHub SQL API - Unidad 2: persistencia relacional con SQLModel, capas, filtros paginados y agenda sin colisiones"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/ui.py" = ["E501"]
